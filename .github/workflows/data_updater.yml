name: Daily Data Update and Commit

on:
  schedule:
    # Runs at 10:00 UTC every day (after US market close)
    - cron: '0 10 * * *' 
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy lxml html5lib beautifulsoup4

      - name: Run Treasury rates update script
        id: run_treasury_script
        run: |
          python update_daily-treasury-rates_data.py

      - name: Run Market Breadth update script
        id: run_breadth_script
        run: |
          python update_market_breadth.py

      - name: Check if commit is needed and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add daily-treasury-rates.csv market_breadth.csv sp500_symbols.csv
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto: Update daily market data, market_breadth.csv, and treasury rates"
            git push
          else
            echo "No changes to commit."
          fi
