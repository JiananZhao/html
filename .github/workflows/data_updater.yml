name: Daily Data Update and Commit

on:
  schedule:
    # 1 hour after US market close: 5:00 PM EDT (21:00 UTC) / 5:00 PM EST (22:00 UTC), Mon-Fri
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy lxml html5lib beautifulsoup4 matplotlib scipy plotly openpyxl kaleido

      - name: Cache .states/ directory
        uses: actions/cache@v4
        with:
          path: .states/
          key: ${{ runner.os }}-states-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-states-
            
      - name: Run Treasury rates update script
        id: run_treasury_script
        run: |
          python update_daily-treasury-rates_data.py

      - name: Run Market Breadth update script
        id: run_breadth_script
        run: |
          python update_market_breadth.py

      - name: Run Macro Reflexivity Model daily monitor & updater
        id: run_reflexivity_script
        run: |
          python daily_market_monitor.py

      - name: Run Macro QQQ & SPY 4-Layer Dual-Track Models
        run: |
          python export_alpha_model_deliverables.py

      - name: Run Micro Bubble Radar Models
        run: |
          python micro_bubble_radar.py
          python smh_bubble_radar.py
          python vnq_bubble_radar.py
          python kre_bubble_radar.py
          python energy_bubble_radar.py
          python now_reflexivity_radar.py
          python single_stock_reflexivity_radar.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto: Update daily market data, all alpha models, and all micro radars"
            git push
          else
            echo "No changes to commit."
          fi
