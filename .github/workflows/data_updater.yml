name: Daily Data Update and Commit

on:
  schedule:
    # 1 hour after US market close: 5:00 PM EDT (21:00 UTC) / 5:00 PM EST (22:00 UTC), Mon-Fri
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy lxml html5lib beautifulsoup4 matplotlib scipy plotly openpyxl kaleido pypdf streamlit

      - name: Cache .states/ directory
        uses: actions/cache@v4
        with:
          path: .states/
          key: ${{ runner.os }}-states-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-states-

      # =========================================================================
      # 阶段一：客观现实数据采集与即时持久化（核心生命线：独立提交、确保落袋）
      # =========================================================================

      - name: Stage 1.1 - Run Treasury rates update script
        id: run_treasury_script
        run: |
          python update_daily-treasury-rates_data.py

      - name: Stage 1.2 - Run Market Breadth update script
        id: run_breadth_script
        run: |
          python update_market_breadth.py

      - name: Stage 1.3 - Run FactSet S&P 500 NTM EPS update script
        id: run_factset_eps_script
        run: |
          python update_sp500_ntm_eps.py

      - name: Stage 1.4 - Run Local Constituents Incremental Update
        id: run_constituents_script
        run: |
          python update_local_constituents.py

      - name: Stage 1 Checkpoint - Commit and Push Raw Market Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 仅暂存第一阶段产生的客观基础行情文件
          git add daily-treasury-rates.csv market_breadth.csv sp500_ntm_eps.csv *_constituents_local.csv 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            echo "Stage 1: Raw market data updated. Committing and pushing..."
            git commit -m "Auto: Update daily raw market data [Stage 1]"
            git push origin master
          else
            echo "Stage 1: No raw data changes detected."
          fi

      # =========================================================================
      # 阶段二：量化衍生模型与微观雷达（衍生计算层：容错隔离、独立提交）
      # =========================================================================

      - name: Stage 2.1 - Run Macro Reflexivity Model daily monitor & updater
        id: run_reflexivity_script
        continue-on-error: true
        run: |
          python daily_market_monitor.py

      - name: Stage 2.2 - Run Macro QQQ & SPY 4-Layer Dual-Track Models
        id: run_alpha_deliverables_script
        continue-on-error: true
        run: |
          python export_alpha_model_deliverables.py

      - name: Stage 2.3 - Run Micro Bubble Radar Models (Isolated Loop)
        id: run_radars_script
        continue-on-error: true
        run: |
          for script in micro_bubble_radar.py smh_bubble_radar.py vnq_bubble_radar.py kre_bubble_radar.py energy_bubble_radar.py now_reflexivity_radar.py single_stock_reflexivity_radar.py; do
            echo ">>> Executing $script ..."
            python "$script" || echo "WARNING: $script exited with error code $?, continuing next radar..."
          done

      - name: Stage 2 Checkpoint - Commit and Push Model Deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if ! git diff --cached --quiet; then
            echo "Stage 2: Model deliverables updated. Committing and pushing..."
            git pull --rebase origin master 2>/dev/null || true
            git commit -m "Auto: Update alpha models and bubble radars [Stage 2]"
            git push origin master
          else
            echo "Stage 2: No model deliverables changes detected."
          fi
